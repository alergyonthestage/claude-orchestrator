# changelog.yml — Additive changes notification registry
#
# This file tracks additive (non-breaking) changes to cco that users should
# know about. Each entry describes a new optional feature, config field, or
# capability. Users are notified of new entries via `cco update` (summary)
# or `cco update --news` (full details).
#
# Entry format:
#   - id: <sequential integer>   # must increment; never reuse IDs
#     date: "YYYY-MM-DD"
#     type: additive
#     title: "Short description"
#     description: "Details about the new feature and how to use it"
#
# Two trackers in .cco/meta control notification behavior:
#   last_seen_changelog — updated by discovery + news, prevents repeated summary
#   last_read_changelog — updated by news only, tracks detailed reading
# Discovery shows entries with id > last_seen. News shows entries with id > last_read.

entries:
  - id: 1
    date: "2026-03-14"
    type: additive
    title: "Vault profiles for multi-PC selective sync"
    description: >
      Use vault profiles to sync different project sets to different machines.
      Create a profile with `cco vault profile create <name>`, move projects
      with `cco vault move project <name> <profile>`, and push/pull as usual.
      Shared resources (global config, packs, templates) sync automatically
      across all profiles. Without profiles, the vault works exactly as before.

  - id: 2
    date: "2026-03-14"
    type: additive
    title: "Memory is now vault-tracked, separated from claude-state"
    description: >
      Auto memory files (MEMORY.md and topic files) now live at
      `projects/<name>/memory/` instead of inside `claude-state/memory/`.
      This directory is vault-tracked, so memory syncs across machines via
      `cco vault push/pull`. Session transcripts remain in `.cco/claude-state/`
      (gitignored). Existing projects are migrated automatically by
      `cco update` (migration 008).

  - id: 3
    date: "2026-03-15"
    type: additive
    title: "Cleaner project layout — framework files hidden in .cco/"
    description: >
      All framework-managed files (.cco-meta, .cco-base/, .managed/,
      docker-compose.yml, claude-state/) are now inside per-scope .cco/
      directories. Your project root shows only files you edit: project.yml,
      .claude/, memory/, setup.sh. Existing installations are migrated
      automatically by `cco update` (migration 009). No action needed.

  - id: 4
    date: "2026-03-17"
    type: additive
    title: "Built-in tutorial — always up to date"
    description: >
      The tutorial is now built into the framework. Run `cco start tutorial`
      directly — no installation needed, always reflects the current framework
      version. Existing tutorial projects in user-config are detected by
      `cco update` (migration 010) with an option to remove them.
      For config editing capabilities, use the new config-editor template:
      `cco project create my-editor --template config-editor`.

  - id: 5
    date: "2026-03-17"
    type: additive
    title: "Config-editor project template"
    description: >
      New native template for editing your cco configuration directly. Mounts
      user-config as a read-write repository with skills for assisted project
      and pack creation. Includes safety rules for vault awareness and
      protected paths. Create with:
      `cco project create my-editor --template config-editor`.

  - id: 6
    date: "2026-03-17"
    type: additive
    title: "New-file sync option and improved update detection"
    description: >
      `cco update --sync` now offers a (N)ew-file option when merging
      conflicting files. Instead of 3-way merge, it saves the framework
      version as `.new` alongside your file for manual review — recommended
      when you've restructured a file significantly. Also, project CLAUDE.md
      is now tracked for updates (previously silent). Run `cco clean --new`
      to remove .new files after review.

  - id: 7
    date: "2026-03-17"
    type: additive
    title: "Publish-install sync — update installed projects from remote"
    description: >
      Installed projects can now receive updates from their source.
      `cco update` shows available updates from all sources (framework + remotes).
      `cco project update <name>` fetches and merges publisher updates with
      3-way merge preserving your local customizations.
      `cco project publish` now includes safety checks (migration validation,
      secret scan, framework alignment warning, diff review).
      `cco project internalize <name>` disconnects from remote source.
      `cco update --sync <project> --local` applies framework defaults directly
      on installed projects (bypass publisher chain).
      See `docs/user-guides/configuration-management.md` for the complete guide.

  - id: 8
    date: "2026-03-19"
    type: additive
    title: "Defaults alignment — improved rules, documentation practices, workspace safety"
    description: >
      Global defaults updated to align with user guides (FI-2 + FI-5).
      Key changes: `diagrams.md` renamed to `documentation.md` (includes docs
      structure practices), `workflow.md` expanded with approval gates and task
      decomposition principles, global CLAUDE.md simplified (no longer duplicates
      rule content). Managed CLAUDE.md now includes context hierarchy and workspace
      safety guidance. `/init-workspace` guides users through empty workspace setup.
      Run `cco update` to discover changes and `cco update --sync` to apply.

  - id: 9
    date: "2026-03-19"
    type: additive
    title: "PromptSubmit hook and documentation-first rule"
    description: >
      New managed hook reinforces key behavioral rules on every prompt —
      reminds the agent to check configured rules, verify git status,
      commit atomically, and consult existing docs before proposing changes.
      New managed rule (documentation-first.md) requires the agent to read
      existing design documents, ADRs, and prior analysis before starting
      new work on any topic. Both are baked into the Docker image and active
      automatically after `cco build`.

  - id: 10
    date: "2026-03-24"
    type: additive
    title: "llms.txt framework documentation support"
    description: >
      New `cco llms` command family for managing official framework documentation
      following the llms.txt standard. Install docs with `cco llms install <url>`,
      reference them from packs or projects via the new `llms:` section in
      pack.yml/project.yml, and keep them updated with `cco llms update --all`.
      Documentation files are mounted read-only and listed in the agent's context
      at session start. A new managed rule (use-official-docs.md) guides agents
      to consult installed docs before writing framework-specific code.
      Run `cco build` to include the managed rule, then `cco llms install` to
      add your first framework docs.

  - id: 11
    date: "2026-03-26"
    type: additive
    title: "Real profile isolation — vault switch changes files on disk"
    description: >
      Vault profiles now provide real git-level isolation. `vault switch`
      changes the files visible on disk — each project exists on exactly one
      branch. Key changes: `vault sync` renamed to `vault save` (commits +
      propagates shared resources to all profiles). `vault move project <name>
      <target>` physically relocates files between branches. `vault remove`
      deletes from current branch with auto-backup for last-copy scenarios.
      New profiles start empty — use `vault move` to assign projects.
      Portable files (secrets.env, session transcripts) are preserved across
      switches via shadow directories. Tracking-only profiles from Sprint 7
      must be reset manually (delete branches, re-create with new commands).

  - id: 12
    date: "2026-03-31"
    type: additive
    title: "Unified local path resolution for portable configs"
    description: >
      Project configs are now fully portable across machines. When using vault
      save or publishing to Config Repos, machine-specific repo paths and extra
      mount sources are automatically replaced with @local markers. Each PC
      maintains its own path mappings in .cco/local-paths.yml (auto-managed,
      gitignored). On `cco start`, missing paths prompt interactively with
      clone-from-URL option. New `cco project resolve <name>` command for
      explicit path management. Existing workflows require no changes —
      the first `vault save` extracts paths automatically.

  - id: 13
    date: "2026-04-22"
    type: additive
    title: "Vault runtime invariants — self-healing gitignore, ghost cleanup, legacy normalize, start guard"
    description: >
      Seven subtle bugs affecting users with pre-existing vaults and
      profile branches are now self-healed at every vault operation, so
      no migration or manual action is required. (#B15) Branches missing
      .gitignore patterns added in later migrations are auto-patched on
      the next vault command — the persistent `?? projects/*/.cco/
      project.yml.pre-save` phantom-diff loop is gone. (#B16) Profile
      switch now removes ghost project directories whose content on
      disk is entirely gitignored residue of the source branch. (#B17)
      `cco start` now refuses to launch if any repo or mount remains
      @local after resolution — no more silent empty bind mounts.
      (#B18) `cco project resolve --show` and `cco start` share a
      single effective-paths reader, eliminating the `✓ exists` vs
      `Unresolved` divergence. (#B19) Legacy vaults whose project.yml
      files were committed with real absolute host paths (pre-@local
      feature) are auto-upgraded: the real paths move into the PC-local
      `.cco/local-paths.yml`, the committed tree is rewritten to
      `@local`, and the user's working copy is left untouched. This
      unblocks `vault diff/save/switch` on legacy branches that used to
      show perpetual M, refuse to commit, and refuse to switch. (#B20)
      Every tracked file that matches the current `.gitignore` is
      auto-untracked — mktemp leftovers (`project.yml.XXXXXX`), `.bak`
      backups, and anything else that became gitignored after it was
      first committed. The mktemp sites in local-paths.sh now install
      a RETURN trap so future failed AWK rewrites can no longer leave
      orphan tempfiles. (#B21) `cco project resolve` interactive mode
      now uses the same canonical reader as `--show`, so file mounts
      are correctly accepted and the "All paths resolved" summary
      never contradicts itself. Extra mounts pointing to single files
      (not directories) are also accepted throughout. No user action
      needed — every new fix is self-applied the next time a relevant
      vault command runs.

  - id: 14
    date: "2026-06-23"
    type: breaking
    title: "Decentralized config cutover: vault removed, config moves in-repo"
    description: >
      BREAKING — the central user-config/ + vault world is replaced by the
      decentralized in-repo config model. Project config now lives in each
      repo at <repo>/.cco/ (project.yml with logical names + machine-agnostic
      url/ref coordinates; its claude/ tree; secrets.env stays gitignored).
      The global personal store moves to ~/.cco (global/.claude, packs/,
      templates/) and is versioned + multi-PC synced with
      `cco config save / push / pull` (the `cco vault *` surface is REMOVED).
      Profiles are replaced by per-user tags (`cco tag add/rm`, `cco list
      --tag`). Memory and transcripts are now machine-local STATE with NO
      sync in v1 (cross-PC/cross-team sync is a future opt-in) — they are no
      longer vault-tracked. `cco project create` is removed; the single entry
      verb is `cco init` (scaffold a repo's .cco/ + ensure ~/.cco/global),
      with `cco join` and `cco init --migrate <project>`. Sharing is via a
      sharing repo (`cco pack/template publish|install`); the central
      manifest.yml is removed (structure-based discovery). The config-editor
      is now a built-in session: `cco start config-editor`. Migration is
      offered by `cco update` (eager global, backs up your legacy vault first,
      never destructive) and `cco init --migrate` (per project, lazy). Run
      `cco update` to migrate; your legacy vault is preserved as a fallback.

  - id: 15
    date: "2026-06-25"
    type: additive
    title: "Decentralized config — lifecycle, validation & sharing commands"
    description: >
      The decentralized config model (#14) gains its lifecycle, validation and
      sharing surface — all additive; existing commands and config are unchanged.
      Project lifecycle: `cco forget <project>` deregisters a project (clears its
      machine-local index/tags/state; the repo and its committed .cco/ are left
      untouched — the index self-heals via `cco resolve --scan`).
      `cco project add repo|mount|llms|pack <name>` adds a referenced resource to
      the current project, embedding its machine-agnostic coordinate in
      project.yml and recording the local path in the index in one step (`--path`,
      url-from-origin). `cco init --template <name>` scaffolds a project from a
      template with {{VAR}} substitution across project.yml and the whole claude/
      tree. Validation: `cco config validate [--fix]` detects and (with --fix,
      confirmed) prunes orphaned internal state in STATE/CACHE/DATA;
      `cco project validate [name] [--all] [--reachable]` checks a project's
      share-readiness (coordinates present, no real host paths in committed
      config, no authored-vs-installed pack collision) with a per-severity exit
      code (0/1/2); `cco project coords [--diff | --sync --from <repo>]` reports
      and converges cross-unit coordinate divergence. Sharing & updates:
      `cco update --check` lists installed packs/templates that have an upstream
      update (read-only, 3-state, never writes, exit 0); `cco pack internalize`
      and `cco template internalize [--as <new>]` sever a referenced resource's
      upstream coordinate so it becomes a local authored source (`--as` forks
      under a new name); `cco project export --bundle-packs` carries the project's
      referenced packs in the export closure (installed on import).

  - id: 16
    date: "2026-06-27"
    type: additive
    title: "Unified `cco list` resource index"
    description: >
      Listing is consolidated under one command. `cco list` now prints a compact
      cross-resource index (KIND · NAME · TAGS) of your projects, packs,
      templates, llms docs and remotes, ordered by kind then name. `cco list
      <kind>` shows the detailed per-kind view (repo counts/status, resource
      counts, variants, …); `cco list [<kind>] --tag <t>` filters by tag and
      `--sort name` orders by name. Full detail for one resource stays on
      `cco <kind> show <name>`. The per-noun `cco project|pack|template|llms|remote
      list` verbs were removed — each prints a one-line redirect to
      `cco list <kind>` (ADR-0029). Tags and all other behaviour are unchanged.

  - id: 17
    date: "2026-06-27"
    type: additive
    title: "Uniform destructive-confirmation contract (-y / --yes)"
    description: >
      Every destructive command now follows one contract (ADR-0029 D2): it
      previews what will be removed (including the id-keyed cascade), then asks
      for confirmation. `-y`/`--yes` is the canonical skip-confirmation flag,
      accepted everywhere. `--force` keeps a distinct meaning — override a block,
      e.g. removing a pack/llms entry that is still in use — and implies `-y`.
      `cco pack remove` and `cco llms remove` now confirm unconditionally (no more
      silent removal of an unused resource), and `cco template remove` and
      `cco remote remove` gained a confirmation. Running a destructive command
      with no TTY and no `-y` now refuses with a "re-run with -y" message instead
      of acting blindly. `cco forget`, `cco config validate --fix` and
      `cco project coords --sync` already followed this contract; `cco clean` and
      `cco config pull` are non-destructive and keep their existing behaviour.

  - id: 18
    date: "2026-06-27"
    type: additive
    title: "Verb symmetry: `cco tag remove`, `cco template update`/`validate`"
    description: >
      Resource families gain symmetric verbs (ADR-0029 D3). `cco tag remove` is
      the canonical removal verb (the old `cco tag rm` keeps working as an alias).
      `cco template` reaches parity with `cco pack`: `cco template update <name>`
      (also `--all`) re-clones an installed template from its recorded source —
      superseding the old "future `cco template sync`" placeholder — and
      `cco template validate [name]` (also `--all`) checks a template's structure.
      Templates now mirror packs: create · install · update · publish · export ·
      import · internalize · show · remove · validate. The remaining family
      asymmetries are intentional and documented in each family's `--help`: a
      project has no install/publish/remove (it rides its code-repo remote;
      deregister with `cco forget`), and only `llms` has `rename`.
  - id: 19
    date: "2026-06-29"
    type: additive
    title: "Pack llms references stay re-fetchable (ADR-0032)"
    description: >
      Packs now carry their llms coordinate like projects do, closing a drift
      from the mandatory-llms-url invariant (ADR-0017 D1 / ADR-0019 D6).
      `cco pack validate` is now url-aware: a referenced-but-uninstalled llms
      prints an executable remedy ('cco llms install <url> --name <n>') when the
      manifest carries a url, or flags a share-readiness gap ('has no url
      coordinate') when it does not — at parity with `cco project validate`.
      `cco update` backfills a missing llms url into each installed pack from the
      global llms source where recoverable (idempotent). `cco resolve` now also
      heals missing url-bearing llms (interactive install/different-url/skip) —
      one heal verb for repos, mounts, and llms (P14), no separate command. New
      packs' base template documents the long form with a required url.
  - id: 20
    date: "2026-06-29"
    type: additive
    title: "Unified, greppable validate output (finding F1)"
    description: >
      `cco pack validate` and `cco template validate` now print like
      `cco project validate` (ADR-0023 D2): one "<name>: <reason>" line per
      finding plus a "validate: N issue(s) [error=E warning=W]" summary, with no
      inline ✗/⚠ symbols — severity is the exit code, and the output is
      script/grep-friendly. A valid resource still prints a "… is valid"
      confirmation. (`cco config validate` keeps its orphan-sanitization layout,
      ADR-0021.)
  - id: 21
    date: "2026-06-29"
    type: additive
    title: "cco resolve heals packs + shows every referenced resource; start reuses it"
    description: >
      `cco resolve` now heals a missing pack from its sharing-repo url
      (interactive install / use-a-different-url / skip, via `cco pack install
      --pick`) — extending the one heal verb to all four referenced-resource
      kinds: repos, extra mounts, llms, and packs (P14, ADR-0033). After healing
      it prints a status row per referenced resource (✓ resolved / ⚠ unresolved
      [+url]), so it always shows the complete picture, not only what it prompted
      for. `cco start` now invokes this same resolve surface before launch
      instead of a parallel resolution loop — a single entry point that heals all
      kinds and never hard-blocks on unresolved members.

  - id: 22
    date: "2026-06-29"
    type: additive
    title: "cco join adds the current repo as a project member (Journey E)"
    description: >
      `cco join <project> [--sync] [--name <name>]` now adds the CURRENT repo as a
      new member of an existing project (ADR-0034): it embeds the repo's
      coordinate (name + url derived from `git remote get-url origin`) into the
      project's repos[] and binds its name->path in the index. The repos[] edit is
      applied to every in-sync member; a divergent project (Case C) prompts which
      member's project.yml to update, or all. With --sync the joining repo also
      receives the project's .cco/ (Case B, respecting the ADR-0024 D2 clobber-
      guard); without it it stays a code-only member (Case A). After joining,
      commit + push the changed project.yml in each member and run `cco sync`. The
      former no-argument form (register an already-committed .cco/) is removed —
      `cco start` cwd-first and `cco resolve --scan` cover it.

  - id: 23
    date: "2026-06-29"
    type: additive
    title: "cco forget --purge deletes owned <repo>/.cco/ with backup"
    description: >
      `cco forget <project> --purge` extends deregistration with an optional,
      ownership-guarded deletion of the committed <repo>/.cco/ of every member
      repo the project OWNS (its project.yml `name:` == the project) — a repo that
      hosts a different project, is shared with another project, or is unresolved
      here is left untouched. Each deletion is preceded by a backup tar into STATE
      and a warning if the .cco/ has uncommitted changes. The default remains
      "repo untouched"; --purge is the explicit consent (works non-interactively,
      like -y), an interactive run without it asks before deleting, and a
      non-interactive run without it skips the deletion (ADR-0021 / ADR-0029 D2).

  - id: 24
    date: "2026-06-29"
    type: additive
    title: "Claude Code installed via the native installer (auto-updates in place)"
    description: >
      Claude Code is no longer baked into the Docker image via npm (an officially
      deprecated method). It is now installed at first `cco start` by the official
      native installer into a persistent host CACHE dir bind-mounted into the
      container (~/.local), so the binary and its auth grant survive restarts and
      AUTO-UPDATE in place — no `cco build` needed for upgrades, and no more
      DISABLE_AUTOUPDATER (ADR-0039). The channel/version is a new config knob
      `~/.cco/claude-version` (default `latest`; set `stable` or a pinned `x.y.z`
      to opt out). `cco build --claude-version X` remains a one-off override and
      re-pins an existing install; `cco build --no-cache` now also resets the
      install cache so the next start reinstalls fresh. `cco clean` never touches
      the install cache. First start on a fresh machine adds a one-time ~30s
      install and requires network access.

  - id: 25
    date: "2026-06-30"
    type: additive
    title: "Browse the bundled user docs offline with `cco docs`"
    description: >
      New `cco docs` command surfaces the bundled user documentation on the host,
      always matched to the installed cco version — read-only and offline. Run
      `cco docs` to list available topics, or `cco docs <topic>` to open one
      (matches a path or name under docs/users, e.g. `cco docs cli` or
      `cco docs project-setup`). It uses your `$PAGER` interactively and falls back
      to plain output in pipes/CI. The same docs are also published to the
      project's GitHub Pages site (latest); `cco docs` shows your installed
      version (ADR-0037 D9).

  - id: 26
    date: "2026-06-30"
    type: additive
    title: "`cco update` now reminds you how to upgrade cco itself"
    description: >
      `cco update` runs migrations and config discovery but does NOT upgrade the
      cco engine (the framework tree). It now detects how cco was installed
      (git clone / npm / Homebrew) and prints the matching engine-upgrade command
      at the end of a run — e.g. a clone install suggests
      `git -C <repo> pull && cco update`, an npm install suggests
      `npm update -g @claude-orchestrator/cco && cco update`. Informational only;
      nothing is changed automatically (ADR-0037 D8).

  - id: 27
    date: "2026-06-30"
    type: additive
    title: "`cco --version` and `cco --help` top-level flags"
    description: >
      cco now answers the near-universal top-level CLI flags: `cco --version`
      (or `-v`) prints the installed version, and `cco --help` (or `-h`) prints
      usage — the same as `cco help`. The version is read from package.json (the
      single source of truth), so it never drifts from the published package.
      Both are handled before any command runs and have no side effects (FI-11).

  - id: 28
    date: "2026-07-01"
    type: additive
    title: "Session access knobs: control .claude / .cco edit access per session"
    description: >
      `cco start` now resolves three orthogonal capability knobs that control how
      much of your config a session can edit (ADR-0036): `claude_access`
      (none | repo | all) governs the .claude authoring trees, `cco_access`
      (none | read | edit-project | edit-global | edit-all) governs the .cco
      framework config, and `show_host_paths` (on by default) toggles the
      host<->container path map. Defaults are unchanged (repo / none / on), so
      existing sessions behave exactly as before. Set them per session on the CLI
      (`--claude-access`, `--cco-access`, `--show-host-paths` / `--no-show-host-paths`),
      per project via an optional `access:` block in `project.yml`
      (`access.claude` / `access.cco` / `access.show_host_paths`), or as your
      machine-wide baseline in `~/.cco/access.yml`. Precedence: CLI > project.yml >
      ~/.cco/access.yml > default. `--enable-config-edit` still works as a
      deprecated alias for `--cco-access edit-project`.

  - id: 29
    date: "2026-07-01"
    type: additive
    title: "Wrapped cco in-session: run safe read/edit cco commands inside a container"
    description: >
      Under `--cco-access read` (or an edit level), `cco` now runs INSIDE the
      session container behind a whitelist shim (ADR-0036 D4). Read verbs
      (`list`, `*show`, `*validate`, `docs`, `path list`, `list remotes`,
      `project coords`) work in-session; edit levels also allow the path-free
      write verbs that go through the shared cco functions (`tag`,
      `remote add|remove`, `pack|template|llms create|update|...`, `config save`).
      Host-only verbs are refused with a "run it on the host" hint:
      container-spawning (`start/stop/build/new`), path-resolving lifecycle
      (`resolve/sync/init/join/forget/update/clean`, `project rename`), and
      network/credential ops (`config push`/`config pull`, `remote
      set-token`/`remove-token`). The real buckets are bind-mounted (DATA/CACHE
      per the edit level, STATE index-only read-only); remote tokens and real
      secret files (`secrets.env`, `*.env`/`*.key`/`*.pem`) never reach the
      container — only `*.example` skeletons are visible. Requires a rebuilt image
      (`cco build`). Default sessions (`cco_access=none`) are unaffected.

  - id: 30
    date: "2026-07-01"
    type: additive
    title: "Built-in sessions become capability presets; config-editor --all / --project"
    description: >
      The config-editor and tutorial built-ins are now presets of the session
      capability knobs (ADR-0036 D6): config-editor runs at claude_access=all /
      cco_access=edit-all, the tutorial at none / read. Both gain the wrapped
      `cco` (config-editor read+write, tutorial read-only) operating on the real
      mounted buckets, with real secret files filtered from every config mount.
      `cco start config-editor` accepts `--project <name>` (now repeatable) and a
      new `--all` to mount every resolvable project's `<repo>/.cco` for editing
      (only `<repo>/.cco`, never full repos; unresolved projects are skipped). You
      can still narrow a built-in with an explicit `--cco-access` (e.g.
      `--cco-access edit-project`). Requires a rebuilt image (`cco build`).

  - id: 31
    date: "2026-07-01"
    type: additive
    title: "Unified session-info surface: workspace.yml absorbs packs.md, adds path_map"
    description: >
      The agent-facing session context is now a single file,
      `/workspace/.claude/workspace.yml` (ADR-0041 R1). It absorbs the former
      `packs.md` as new `knowledge` and `llms` sections, so the SessionStart /
      SubagentStart hooks and the `init-workspace` skill all read one surface —
      `packs.md` is no longer generated. When `show_host_paths` is on (the
      default), the file also carries an optional `path_map`: labelled
      host↔container pairs for the mounted repos and extra mounts, so the agent
      can hand you copy-pasteable host commands. Set `--no-show-host-paths` (or
      `access.show_host_paths: false` in `project.yml`, or `show_host_paths: false`
      in `~/.cco/access.yml`) to omit it. The knowledge files themselves stay at
      `/workspace/.claude/packs/…`; only the index moved. Requires a rebuilt image
      (`cco build`).

  - id: 32
    date: "2026-07-02"
    type: additive
    title: "Optional descriptions for repos and extra_mounts in project.yml"
    description: >
      `project.yml` now accepts an optional `description:` on each `repos[]` and
      `extra_mounts[]` entry. When set, the note is surfaced to the agent in the
      session context alongside the resource (e.g. "repo: backend-api at
      /workspace/backend-api — REST API service"), giving it a one-line hint about
      each mounted resource without opening files. Descriptions live only in
      `project.yml` — the single structured source (INV-3, ADR-0042) — so there is
      no generated round-trip. Purely additive: existing projects are unaffected,
      and the fields can be omitted. Requires a rebuilt image (`cco build`) for the
      session-context injection to render them.

  - id: 33
    date: "2026-07-02"
    type: additive
    title: "Scope-aware read output in container sessions (read-project)"
    description: >
      Inside a session the wrapped `cco`'s read verbs now scope their OUTPUT to
      the session's access level (ADR-0043). At `cco_access=read-project` (the
      normal default) `cco list`, `cco list <kind>`, the `<kind> show` verbs,
      `cco project validate|coords`, and `cco path list` show only the current
      project and the packs/llms it references; personal-global resources
      (templates, remotes) and other projects are hidden. Anything hidden is
      announced with a one-line count-only notice on stderr ("N hidden by access
      scope — start a read-global session or run cco on your host"), so a hidden
      resource is never mistaken for a missing one, and a `show` of an
      out-of-scope resource degrades to a clear scope message instead of a raw
      "not found". On the host every resource is always visible (no behaviour
      change); at `read-global`/`read-all`/`edit-*` the full set is shown. Widen
      a session with `--cco-access read-global`. Requires a rebuilt image
      (`cco build`).

  - id: 34
    date: "2026-07-02"
    type: additive
    title: "Session context is injected, not a file — workspace.yml retired + cleaned up"
    description: >
      The agent-facing session context introduced in #31 as the generated file
      `/workspace/.claude/workspace.yml` is no longer written anywhere (ADR-0042).
      It is now injected directly into the SessionStart / SubagentStart context
      via the `CCO_SESSION_CONTEXT` environment variable — a generated file never
      belongs in a committed tree. `cco update` now runs a migration that removes
      any committed `claude/workspace.yml`, `claude/packs.md`, and
      `claude/scheduled_tasks.lock` older versions left in a project's
      `<repo>/.cco/`, and adds them to `.cco/.gitignore` so they never reappear
      (the removal is staged for you to commit). New projects are scaffolded
      clean. Requires a rebuilt image (`cco build`).

  - id: 35
    date: "2026-07-02"
    type: additive
    title: "Environment-aware hardening of the wrapped-cco surface (in-container)"
    description: >
      A full audit of every cco verb for container-operator (wrapped-cco)
      sessions tightened three behaviours that only affect cco run INSIDE a
      session (host usage is unchanged). `cco config validate` is now host-only
      in a container — its orphan sweep reads machine-local state (the STATE
      index of host paths) that is incoherent in a container, where it reported
      false orphans and printed host paths. `cco remote add --token` now refuses
      the token inside a container (the token store is host-only; it previously
      wrote an ephemeral secret and falsely reported it saved) — register the url
      here, then run `cco remote set-token` on your host. `cco config save` at
      cco_access=edit-project now explains that the ~/.cco store is read-only and
      needs an edit-global session, instead of a misleading "nothing to save".
      Requires a rebuilt image (`cco build`).

  - id: 36
    date: "2026-07-05"
    type: additive
    title: "Symmetric cco_access scopes, in-container self-introspection, sharper refusals"
    description: >
      The agent↔cco access model gained read/write symmetry and a batch of
      in-container UX fixes (host usage unchanged). cco_access now reads at its
      matching scope on {project, global, all}: edit-project reads at PROJECT
      scope (its own project, like read-project) rather than the whole store, and
      read-global differs from read-all only in other-project visibility. Write
      verbs are gated by their target tree — a global-store write (pack/template/
      llms/tag/remote/config save) needs edit-global+, refused cleanly otherwise.
      New `cco whoami` reports your session's own access state (levels + which
      config trees are writable). In-container `cco help` is now filtered to the
      verbs you can run, with `cco --help --host` for the full list; unknown verbs
      say so (instead of "run it on your host"), removed aliases redirect to
      `cco list <kind>`, and refusal exit codes follow 0/2/1 (ok-or-degrade /
      policy refusal / error). `cco docs` works in every session (docs are baked
      into the image), session detection is fixed (cco stop / list status), and at
      cco_access=none cco is cleanly unavailable. Requires a rebuilt image
      (`cco build`).

  - id: 37
    date: "2026-07-10"
    type: additive
    title: "Granular (global,current,others) cco access, a real privilege boundary, and in-container running status"
    description: >
      The agent↔cco access model is now an explicit three-axis capability
      (ADR-0046): `access.cco` in `project.yml` (or `--cco-access`) accepts, in
      addition to the preset scalars, a granular MAP over three independent trees —
      `global` (the rest of ~/.cco), `current` (this project's .cco), and `others`
      (other projects' .cco) — each on the lattice none < ro < rw, e.g.
      `--cco-access global=ro,current=rw,others=none`. Presets are sugar for the
      symmetric triples; unspecified axes auto-promote to the invariant floor
      (current is never `none` while cco is enabled; others <= current). Two cases
      the presets could not express are now reachable granular-only: edit every
      project's config but not the global store (global=none,current=rw,others=rw),
      and edit the global store while reading all projects (global=rw,current=rw,
      others=ro). `edit-global` is
      REDEFINED from `(rw,ro,none)` to `(rw,rw,none)` — it now also writes the
      current project's config, not just the global store. A new optional
      `access.cco.include_member_configs` (bool, default false) widens the
      `current` write span from the hosting repo's <repo>/.cco to all member repos'
      copies in a multi-repo project. Existing scalar `access.cco` values and
      omitted blocks are unaffected (additive). Enforcement no longer relies only
      on output-scoping: the machine-local internal store (STATE index, DATA, CACHE
      internals) now sits behind a real privilege boundary (ADR-0047) — a
      mode-0700 parent owned by a dedicated `cco-svc` uid that the agent cannot
      traverse, plus a small setuid helper that applies the resolved (G,Pc,Po) from
      a trusted, read-only session descriptor (never argv/env, fail-closed). A
      `read-project` agent that tries to `cat` the index gets EACCES; access-scope
      output filtering is demoted to defense-in-depth. Built-in presets flipped to
      least-privilege: the tutorial is now `read-all` (read-only teacher, full
      context, no write risk) and config-editor resolves to the minimum for its
      target (edit-project in a project, edit-global outside one, edit-all with
      `--all`). Finally, `cco list` and `cco whoami` now report a session's running
      status from a host-reconciled registry (ADR-0045): in-container status is
      shown per scope with a dedicated STATUS column and `--sort status`, and an
      out-of-scope/absent session reads as `unknown` rather than a false `stopped`.
      Requires a rebuilt image (`cco build`).

  - id: 38
    date: "2026-07-11"
    type: additive
    title: "config-editor is now minimum-privilege by mode (reads the store in project mode)"
    description: >
      `cco start config-editor` no longer defaults every mode to writing the whole
      personal store. It is now minimum-privilege BY MODE (ADR-0048): started inside
      a project (or with `--project <name>`) it resolves to `(ro,rw,none)` — the
      target project's `<repo>/.cco` is read-write while `~/.cco` is mounted
      READ-ONLY, so you edit the project and merely *reference* the store. To also
      write the store, add `--cco-access edit-global`. Started bare (outside any
      project) it resolves to the honest `(rw,none,none)` — edit the store only, no
      project in scope (the `current` axis is legitimately `none`; the INV-2 project
      floor is now conditional on a current project being in scope). `--all` /
      `--cco-access edit-all` is unchanged as the explicit broad every-project
      widener. Two coherence floors keep the tool usable: config-editor's `global`
      axis is clamped to at least `ro` (an authoring session must always SEE the
      store — a narrower `--cco-access` is raised to `read-global` with a notice),
      and its `.claude` authoring now follows the store's write level (global
      `.cco/.claude` is writable only when the store is, removing a
      writable-rules/read-only-packs asymmetry). Store-writing verbs (`cco config
      save`, pack/template/llms authoring, `cco remote add|remove`) therefore need a
      store-writable config-editor session and are refused with a "needs edit-global"
      hint in the default project mode. Requires a rebuilt image (`cco build`).

  - id: 39
    date: "2026-07-13"
    type: additive
    title: "Clearer in-session introspection: whoami redesign, cco list built-ins, project show at /workspace"
    description: >
      Session-legibility refinements (they do not change the access model). `cco
      whoami` now leads with a Session block — identity (the session envelope), the
      editing target(s) for a config-editor session, and whether code repos are
      mounted vs config-only — before the access detail, so you see WHO you are and
      WHAT you edit up front (in config-editor the envelope `config-editor` and its
      editing targets are no longer conflated). The access rows are deduplicated: a
      single `level` (the preset name, or `custom (global=…,current=…,others=…)`) plus
      an explicit `triple` (G/Pc/Po + read/write scope) — no more three identical
      views of one triple. `cco list` now surfaces the internal built-ins
      (config-editor, tutorial) as KIND `builtin`: only when running by default, or
      all with `--include-internal` / `cco list builtin` — so a running config-editor
      is visible even from another session. And a bare `cco project show` run from the
      `/workspace` root now resolves the current session project, matching how it
      already worked from inside a mounted repo directory. Requires a rebuilt image
      (`cco build`).

  - id: 40
    date: "2026-07-13"
    type: additive
    title: "claude_access becomes a concordant per-tree triple; .claude authoring defaults to read-only"
    description: >
      claude_access (Axis B) is now modelled as a per-tree triple (Cr,Cp,Cg,Co) on
      the ro<rw lattice — the repo-native, project, global, and other-projects .claude
      authoring trees — mirroring the cco (G,Pc,Po) triple (ADR-0049). The none|repo|all
      enum lives on as preset sugar, and when unspecified each axis DERIVES from your
      cco_access (Cg=G, Cp=Pc, Co=Po, Cr always read-only), so the default is never
      more permissive than your config access. Behaviour change: a normal session no
      longer authors the project/repo .claude tree by default — it is read-only unless
      you pass --claude-access repo|all (or a cco edit level). Both knobs now share one
      grammar in every source (CLI flag, project.yml access.claude, ~/.cco/access.yml):
      a scalar preset OR a granular map ({repo,current,global,others} for claude;
      {global,current,others} for cco). ~/.cco/access.yml is scaffolded commented at
      cco init as the global-default escape and gained granular-map support for both
      knobs. An explicit claude wider than cco is honored with a one-line note (never
      refused). settings.local.json stays writable via a functional-write floor even
      when a .claude tree is read-only. extra_mounts gained config_access_policy
      (ro|project|write) governing their nested .claude/.cco, which is now detected
      recursively (monorepos, extra_mounts), read-only by default. Requires a rebuilt
      image (`cco build`).

  - id: 41
    date: "2026-07-14"
    type: additive
    title: "cco init seeds the current repo into project.yml repos[] (+ --repo-name)"
    description: >
      `cco init` now seeds the repo it runs in into the project's repos[] instead of
      leaving the list empty, so `cco start` mounts it without a manual project.yml
      edit. The repo's logical name defaults to the directory basename (prompted, or
      set with the new --repo-name flag) and is an axis independent of the project
      name (--name). Its coordinate url is derived from `git remote get-url origin`
      when present, else left empty to fill in later. The machine-local index binds
      the repo under its logical name (project membership keyed by repo name), the
      same coordinate model as `cco join`. Existing projects are unaffected; this
      only changes what a fresh `cco init` scaffolds.

  - id: 42
    date: "2026-07-14"
    type: breaking
    title: "Per-project name scoping: index v2 (identity = path, name = per-project label)"
    description: >
      BREAKING (machine-local STATE only — no committed config changes) — repo and
      extra_mount logical names are now PER-PROJECT scoped. A name is a label within
      one project, not a global key; "the same resource" is decided by PATH
      coincidence, never by name (ADR-0051, supersedes ADR-0022 D2). The machine-local
      index moves to version 2 (nested project_paths: <project> -> <name> -> path,
      plus an unscoped: escape-hatch bucket for project-less `cco path set` pins). The
      upgrade is transparent and automatic: a still-v1 index is read as-is, and the
      first host-side write re-homes each flat binding under every project that lists
      it as a member (orphans -> unscoped) — no `cco update`, no migration script,
      since the index is scan-rebuildable STATE (`cco resolve --scan`). Two projects
      may now bind the same name to different paths (independent resources) and one
      path may carry different names in different projects. `cco resolve`/`cco start`
      gained an add-time disambiguation prompt: when a name already exists in another
      project, cco offers to REUSE that path (the same resource) or specify a different
      one (a homonym), flagging a git-origin/url divergence as "probably a different
      resource". Cross-project name matches are no longer refused as collisions; only a
      same-project same-name-different-path clash is refused. The name-based reverse
      lookup is replaced by a path-based one (`cco project show` "referenced by",
      `cco forget` shared-repo guard). No user action required; custom tooling that
      parsed ~/.local/state/cco/index directly must read the v2 nested layout (or
      regenerate with `cco resolve --scan`).

  - id: 43
    date: "2026-07-14"
    type: additive
    title: "Resource rename verbs: cco repo/extra-mount/pack/template/remote rename"
    description: >
      Five kinds that previously had no rename verb gained one, so renaming a
      resource no longer means hand-editing internal stores: `cco repo rename
      [<old>] <new>`, `cco extra-mount rename <old> <new>`, `cco pack rename <old>
      <new>`, `cco template rename <old> <new>`, and `cco remote rename <old> <new>`
      (joining the existing `cco project rename` and `cco llms rename`). Each verb is
      kind-scoped — it re-keys only its own kind's stores, never a same-named
      resource of another kind. repo/extra-mount rename are PROJECT-SCOPED and
      path-anchored (a repo name is a per-project label for a host path, ADR-0051):
      they re-key only the current project's index binding + that project's
      project.yml entry, leaving other projects' same-named-different-path bindings
      and same-path labels untouched; repo rename is cwd-first (omit <old> to rename
      the repo hosting the working directory), and an optional --move-dir also moves
      the on-disk directory (basename-gated, default No). pack rename fans out the
      packs[] reference across every referencing project (pack names stay global) and
      moves the store dir + DATA/STATE sidecars + tags; template/remote rename re-key
      their stores similarly. In a wrapped-cco (in-container) session, repo/
      extra-mount rename run at edit-project and pack/template/remote rename at
      edit-global. Two path-input papercuts are also fixed: `cco path set`/`cco
      resolve` now strip one pair of surrounding quotes from a pasted path
      ('/my/repo' or "/my/repo"), and `cco path set` hints `cco repo rename` when the
      index name no longer matches the directory basename. Additive; no migration.

  - id: 44
    date: "2026-07-15"
    type: additive
    title: "settings.local.json: an inert mountpoint stub now appears in <repo>/.cco/claude/"
    description: >
      The functional-write floor (ADR-0049 §5) keeps .claude/settings.local.json
      writable while the surrounding .claude tree is mounted read-only — the
      default since the claude_access model landed. It does that by binding a
      per-project machine-local STATE copy over the file, and Docker can only
      bind onto a target that already exists: it cannot create one inside a
      read-only mount. `cco start` therefore seeds an inert stub at
      <repo>/.cco/claude/settings.local.json (and at <repo>/.claude/settings.local.json
      for each repo that has a .claude tree, when one is missing). The stub is
      never read in a session — the rw STATE copy always shadows it — and never
      committed: migration 015 adds it to .cco/.gitignore, alongside the other
      generated session artifacts. A tree that ALREADY carried a real
      settings.local.json keeps it: its content seeds STATE on first start rather
      than being shadowed by an empty object, so existing "Always allow" grants
      and local prefs survive. Nothing to do — the seeding is automatic.

  - id: 45
    date: "2026-07-15"
    type: additive
    title: "cco start recovers from a stale Claude Code launcher instead of failing"
    description: >
      The native installer (ADR-0039) refuses to overwrite a launcher it did not
      create: `claude install` exits with "the existing file there was not created
      by the native installer and is not a working launcher". Because the install
      lives in the shared CACHE dir (~/.cache/cco/claude-install), a single stale
      launcher — an npm-era wrapper, a `claude migrate-installer` result, or a
      symlink dangling at a version that share/claude/versions no longer holds —
      made the entrypoint FATAL on `cco start` for EVERY project, with no
      documented way out (the fix was `cco build --no-cache`, which the error did
      not mention; the reported "Network access is required" was misleading when
      the network was fine). The entrypoint now clears the launcher path before
      installing — it only ever gets there when it has already decided to
      (re)install, and the install itself lives in share/claude/versions — so a
      poisoned cache self-heals on the next start. A healthy install is still
      never reinstalled ("one-time per cache"): the marker check is unchanged, and
      the auto-updater keeps the binary current. If an install genuinely fails,
      the FATAL now names `cco build --no-cache` as the cache reset. Requires
      `cco build` (the entrypoint is baked into the image).

  - id: 46
    date: "2026-07-20"
    type: additive
    title: "Container-session config access: honest failures, scoped path list, config-editor repos"
    description: >
      The e2e acceptance review of the agent↔cco access model (cycle 1) closed
      five container-session enforcement gaps. All are in-container behaviour; the
      host, `read-all`/`edit-all`, and path *resolution* are unchanged. (1)
      Store-mutating verbs (pack/template/llms/remote rename and remove, and the
      destructive re-key cascades) now FAIL with exit 1 and the real reason when
      the internal store is unwritable, instead of printing a false success or a
      spurious "not found"; a rename is applied wholly or refused wholly, never
      half-applied. (`pack install` and the other provenance writers are a clean
      in-container refusal until cycle 2.) (2) `cco path list` now scopes EVERY row
      by its owning project: bindings stored under no project (the `unscoped:`
      bucket) were previously always shown — including their host paths —
      regardless of access level; they now require a `read-all` session, like any
      other project you do not own, and are counted in the hidden notice — unless
      the current project actually resolves one of them (a name it declares and
      does not otherwise bind), in which case it stays visible, because it is one
      of this session's own mounts. (3) `cco start config-editor` now MOUNTS the
      target project's member repos (not only its `.cco`), so repo-aware authoring
      works; a target that is not mounted is announced, not silently skipped. (4)
      The nested-config readonly clamp no longer over-clamps a config-editor
      target's or the store's own `.cco` when the session's access triple grants
      write. (5) `cco repo rename` / `cco extra-mount rename` now run to completion
      in-container (name-only; `--move-dir` is refused with a host hint). A
      resource that exists on this machine but is not bound into the current
      session now says "not mounted in this session" with a host remedy, instead
      of a misleading "run cco resolve". Requires `cco build`.

  - id: 47
    date: "2026-07-21"
    type: additive
    title: "Container sessions: the internal index crosses as a directory, and every write says what it did"
    description: >
      The e2e acceptance run of cycle 1 found that its fixes could not work as
      shipped, for one reason: the machine-local STATE bucket crossed into a
      session as individual FILE mounts while every other bucket crossed as a
      directory. A file mount gives the container no writable parent, and every
      index write replaces the file atomically through a sibling temp — so
      in-container index writes failed while the command still printed a ✓.
      Cycle 1.1 closes that root and the class of silent failures around it.
      (1) The container-shareable STATE members — the index and the pack/template
      update sidecars — now live under `<state>/cco/shared/` and that ONE
      directory is what a session binds. Migration 017 moves them for you on the
      next `cco update`; it is idempotent and needs no input. What stays outside
      `shared/` never reaches a container by construction: the 0600 remote-token
      store, session transcripts, and memory. Three failures disappear with it —
      `cco repo rename` / `cco extra-mount rename` half-applying while reporting
      success, `cco pack|template remove|rename` being dead at `edit-all`, and
      `cco path list` printing zero rows at exit 0 after a host-side rename.
      (2) Writes that cannot be performed now FAIL, loudly and by name, instead
      of returning success: the index writers, the `project.yml` fan-out of a
      rename, the token-store cascades, and the host-only entry verbs (`cco init`,
      `cco join`, `cco forget`, `cco project import`, `cco resolve --scan`,
      `cco path set`, migrations) all propagate the real status. `cco init` no
      longer announces "registered it in the index" when it did not, and `cco join`
      no longer tells you to commit a `project.yml` naming a member nothing binds.
      (3) A rename is now refused UP FRONT when either store it must touch cannot
      be written, so it is applied wholly or not at all. (4) Reading is honest
      too: an index that is unreadable or truncated is reported as such by
      `cco path list`, `cco list`, `cco list projects`, and `cco config validate`,
      instead of being read as "you have nothing configured".
      (5) BEHAVIOUR CHANGE — `cco remote remove` and `cco remote rename` are now
      **host-only**, refused in-session with a host hint, joining
      `remote set-token` / `remove-token`. They cascade into the 0600 token store,
      which never crosses into a session: with the token file unmounted cco cannot
      tell "no token" from "token invisible", so both would have succeeded
      silently while orphaning the token and stripping the remote's auth.
      `cco remote add` stays available in-session. (6) `cco project show` and
      `cco project validate` now answer "is this available?" with one voice —
      `show` used to blame access scope and prescribe a widening that does not
      exist at `read-all` — and `validate` works from the `/workspace` root like
      `show` already did. (7) `cco start config-editor` announces every surface it
      drops, including a project the index knows but cannot mount (with the right
      remedy: `cco init` when the repo is there but unconfigured, `cco resolve`
      when it is not on this machine). It deliberately never mounts a target's
      `extra_mounts` — it authors config, and they are reference material — and it
      now SAYS so, because `cco path list` shows those bindings and silence read
      as "reachable". (8) `cco project show` gained an extra_mounts section listing
      them by logical name — the key `cco path` and `cco extra-mount rename` take —
      marking `[unresolved]` when one is declared but not bound. (9) `cco whoami`
      reports `image built from: <branch>@<sha>`, so a session can prove which
      build it is running before you trust what it tells you. (10) The "hidden by
      access scope" notice no longer offers `read-global` when everything it hid
      was a project — `read-global` reveals no project; it offers `read-all`. A
      mixed set still offers both. (11) Bare `cco repo rename <new>` /
      `cco extra-mount rename <new>` at the `/workspace` root is now refused for
      the right reason — it cannot tell WHICH member you mean — and tells you to
      cd into the one you want. It used to answer as if no project were in scope
      and suggest passing `<old> <new>`, which fails there too. Requires
      `cco build`.

  - id: 48
    date: "2026-07-23"
    type: additive
    title: "Index integrity: data preservation on upgrade, version gate, dev sandbox"
    description: >
      The machine-local path index (logical name → absolute path) is now hardened
      against version skew and never loses your registered paths on an upgrade.
      (1) DATA PRESERVATION — upgrading from an older cco whose index lived at the
      old location (`<state>/cco/index`) now MERGES it into the current one
      (`<state>/cco/shared/index`) non-destructively: entries the new file lacks are
      adopted, agreeing paths are deduped, and a genuine conflict (same name, two
      paths) keeps BOTH files and warns rather than deleting either. The old
      "new-wins `rm -f`" that could drop paths when you ran `cco start`/`cco resolve`
      before `cco update` is gone. It heals automatically on any command (host-side),
      so the natural start-before-update order is safe. A stray old-format residue
      written back into a v2 file by an alternating older binary is re-absorbed on
      the next write, never silently ignored. (2) FAIL-LOUD VERSION GATE — if your
      on-disk index or global config is NEWER than the running cco understands, cco
      now refuses to run with a clear message ("use the cco that wrote it, or run its
      `cco update`") instead of silently misreading it and reporting an empty index.
      (3) EXTRA-MOUNT RE-HOME — a legacy extra_mount is migrated UNDER the project
      whose `project.yml` declares it, not into a global bucket; `cco config validate
      --fix` re-homes any residue already on disk (a dedicated re-home lane, distinct
      from orphan pruning). (4) SAFER `cco config validate` — malformed/unparseable
      internal index records are now REPORTED under their own heading and NEVER
      auto-pruned (you decide format repair); only genuine orphans are pruned, under
      the existing two-phase confirm. (5) DEVELOPER SANDBOX — `cco --dev-sandbox`
      (or `CCO_DEV_SANDBOX=1`) redirects cco's internal STATE/DATA/CACHE buckets to
      an isolated root (`~/.cco-devsandbox`) so running a development build alongside
      the published one never shares — or corrupts — your real state; `~/.cco` stays
      shared. Add `--dev-sandbox-seed` (or `CCO_DEV_SANDBOX_SEED=1`) for a one-shot
      copy of your real STATE+DATA into the sandbox. `cco whoami` reports when a
      sandbox is active. (6) `q`/Exit at a `cco start` mount-resolve prompt now
      ABORTS the launch (no session boots) instead of skipping and starting anyway;
      standalone `cco resolve` exits cleanly. Requires `cco build`.

  - id: 49
    date: "2026-07-24"
    type: additive
    title: "CCO_NONINTERACTIVE — force every prompt to its non-interactive branch"
    description: >
      New environment variable `CCO_NONINTERACTIVE=1` makes cco behave as if no
      controlling terminal were present: every interactive prompt (language,
      project/repo name, update-sync merge choices, migration confirmations,
      destructive-action confirmations, path disambiguation, …) takes the same
      non-interactive branch it already takes under Docker/CI — falling back to
      defaults or requiring an explicit flag (`-y`/`--auto-approve`) rather than
      blocking on input. Use it when scripting cco in automation that runs from a
      terminal (where prompts would otherwise wait for a human), or to make a
      command's behavior identical whether launched interactively or headless. It
      is honoured centrally by `_cco_have_tty`, so it covers all prompts uniformly;
      it is complementary to `CCO_ASSUME_YES=1` (which ANSWERS a yes/no prompt
      "yes" instead of skipping it). The project's own test runner (`bin/test`) now
      exports it, which is what makes the suite immune to a captured prompt hanging
      it when run from a real terminal.
  - id: 50
    date: "2026-07-24"
    type: additive
    title: "Canonical index paths — consistent identity on macOS (symlinks, trailing /.)"
    description: >
      The machine-local path index now stores every repo/extra_mount path in its
      CANONICAL form: symlinked prefixes are resolved (on macOS `/tmp` and `/var`
      are symlinks to `/private/tmp` and `/private/var`) and lexical noise
      (duplicate slashes, `/./`, a trailing `/.`) is collapsed, at the single write
      boundary. This closes a divergence where the same working tree reached one way
      via the cwd (physical path) and another via a coordinate or `cco path set`
      (unresolved symlink) was recorded as two different resources — breaking by-name
      resolve, cwd-first repo/extra_mount rename, `join` member indexing, the AD5′
      uniqueness check, and firing spurious index-reconcile warnings. Existing
      divergent entries self-heal on the next write and can be repaired in bulk with
      a new `cco config validate` lane: `re-key` reports a stored path whose spelling
      is non-canonical and `--fix` rewrites it to the canonical form (data-preserving,
      distinct from the `malformed` lane, which is still reported-only). Identity is
      the physical path (ADR-0051 D1); see ADR-0053.

  - id: 51
    date: "2026-07-26"
    type: additive
    title: "Packs with skills/rules/agents now start at the default access level"
    description: >
      `cco start` could die before the session existed — "create mountpoint …:
      read-only file system" from runc — for any project that adopted a pack
      shipping skills, rules, agents or knowledge (and for llms docs) while the
      `claude` access stayed at its default. Cause: those resources are mounted as
      CHILD binds inside `/workspace/.claude`, and a child bind needs its mountpoint
      to already exist — Docker cannot create it through a read-only parent, which
      is what the committed `.cco/claude/` tree became when ADR-0049 made `Cp=ro`
      the default. Only projects created before that flip kept working, on
      mountpoint directories that had been auto-created back when the tree was
      writable. cco now owns those mountpoints: when a session injects pack/llms
      overlays it composes the `/workspace/.claude` parent from a mountpoints-only
      view in CACHE (rebuilt at every start) and binds the committed tree back in
      entry by entry, at the same access mode as before. Pack visibility no longer
      depends on the `claude` policy — that policy governs authoring only. Nothing
      changes for a project without packs or llms, and the committed tree stops
      accumulating empty mountpoint residue. In a session that both composes and has
      `claude` write access, a NEWLY created file placed directly in a composed
      namespace is session-local (edits to existing files still reach the repo);
      `cco start` says so once. No migration; see ADR-0054.

  - id: 52
    date: "2026-07-28"
    type: additive
    title: "Claude Code's own runtime state is writable and persisted at every access level"
    description: >
      Two failures with one cause: cco never classified which parts of
      `~/.claude` and `/workspace/.claude` belong to Claude Code as RUNTIME
      STATE rather than to you as authoring config. Subagents and agent-team
      teammates started from inside a repo (and worktree or background
      sessions) could not write their transcripts — `~/.claude/projects` was
      created root-owned by the container runtime, so only the `-workspace`
      key worked; and saving a project-scope workflow failed, because
      `/workspace/.claude/workflows/` sits in the tree that is read-only
      unless you opt into `claude_access: all`. `claude_access` now governs
      authoring only (CLAUDE.md, rules, agents, skills); Claude Code's
      runtime state stays writable at every level, as `settings.json`
      already did. Transcripts persist for EVERY session key, not just the
      one started at `/workspace`, so `/resume` finds subagent, teammate and
      worktree sessions after a restart. Workflows saved by a read-project
      session persist in machine-local state instead of the repo; under
      `claude_access: all` they land in the repo and are shared via git, as
      the Claude Code docs describe — the access level is the choice. A repo
      that already commits `.cco/claude/workflows/` keeps seeing them. No
      migration: an existing transcripts bucket is repaired in place at the
      next `cco start`, without losing history. Requires `cco build`; see
      ADR-0055.

  - id: 53
    date: "2026-07-29"
    type: additive
    title: "In-session cco refuses index-reading verbs it cannot answer, instead of reporting an empty index"
    description: >
      A cco session is LAUNCHED from the machine-local path index, so inside a
      session a missing index can never mean "nothing is registered on this
      machine yet" — it means the bind was severed, the host-side state was
      removed, or the internal store is unreachable. Until now the index-reading
      verbs (`cco list`, `cco list projects`, `cco path list`, `cco project
      list`, `cco project validate --all`) reported that state as an EMPTY index
      at exit 0, and `cco project show` rendered a fabricated card — mounts that
      were bound and readable badged `[unresolved]`, and a repo host path
      silently downgraded to its container path. Those verbs now refuse at entry
      with a message naming the real cause and a remedy that works where it is
      printed (`cco resolve` is host-only in a session and is never prescribed
      there). `cco project show` renders no card at all rather than a fabricated
      one, and `[unresolved]` now means exactly one thing: the index holds no
      binding for that member. On the host nothing changes — a machine with
      nothing registered yet legitimately has no index file, and still says so.
      USER-VISIBLE REGRESSION, deliberate: on native Linux the internal store is
      unreachable from a session by construction (0700 buckets owned by the
      elevated identity), so these verbs begin refusing there instead of
      answering confidently and wrongly. Native Linux support is scheduled for
      cycle-2; until then, run cco on your host. Requires `cco build`; see
      ADR-0056 (D6, D7).

  - id: 54
    date: "2026-07-29"
    type: additive
    title: "'cco project add' no longer drops the new entry into the next section"
    description: >
      Adding a coordinate (`cco project add repo|mount|llms|pack`, and the
      first repo written by `cco init` / `cco join`) decided where a section
      of `project.yml` ends by looking for the first top-level line that is
      not a comment. A comment block therefore did not close the section, so
      the new entry slid PAST it and landed after the NEXT section's header
      comment. On a project.yml scaffolded from the shipped template — where
      `extra_mounts`, `packs`, `llms`, `github` and `browser` all ship
      commented out — a second `cco project add repo` put its entry under the
      "Docker options" banner, immediately above `docker:`. A section now
      ends at the next top-level key, with the trailing run of top-level
      comment and blank lines treated as that key's header: the new entry is
      emitted before it. Indented commented examples (`  # - name: my-repo`)
      are section content, so the entry lands after them, still inside its
      own section. Nothing to migrate — YAML reads an already-misplaced entry
      as part of the intended section, so existing files stay correct; move
      the entry by hand if you want the file to read straight again.
      Requires `cco build` for the in-session `cco`.

  - id: 55
    date: "2026-07-29"
    type: additive
    title: "No more '✗ cco exited unexpectedly' on runs that did not fail"
    description: >
      cco arms an exit trap that reports a crash unless the run marked itself
      complete, so that a `set -e`/`set -u` violation or a syntax error is
      never silent. Two ordinary paths forgot the mark. `cco project` and
      `cco pack` with no subcommand printed their group help, exited 0, and
      then printed "✗ cco exited unexpectedly (exit 0)" underneath it. And a
      mistyped `--cco-access` got the crash line appended to its perfectly
      correct refusal — the refusal is raised inside a subshell, whose mark
      never reached the parent. Both are fixed: every deliberate exit now
      goes through one primitive, so the trap speaks only for real crashes —
      which is the point, since a warning users learn to ignore stops working
      as a warning. Requires `cco build` for the in-session `cco`.

  - id: 56
    date: "2026-07-29"
    type: additive
    title: "One owner for availability answers — hidden is no longer reported as missing"
    description: >
      cco used to render "I cannot see X from here" as "X is not there", and
      computed the remedy without regard to where the message was printed. Every
      verb now ASKS the shared availability layer instead of deciding for itself,
      so one vocabulary covers the three realities: a resource that is here, one
      that exists but is not bound into this session, and one that is not
      resolved at all. Concretely: `cco project show` badges a bound-but-unmounted
      member `[not mounted in this session]` instead of `[missing]`, and the same
      for a config-editor target's dropped extra_mounts and for packs it cannot
      see; the retired `[missing]` badge is gone. The widening a message offers is
      now derived from WHAT WAS HIDDEN — a hidden project offers `read-all`
      (`read-global` is precisely the level that keeps other projects hidden, so
      naming it revealed nothing), a hidden pack/template/remote offers
      `read-global`. A message printed inside a session no longer prescribes
      `cco resolve`, which is host-only there; it says to run it on your host.
      `cco project coords <name>` now refuses an out-of-scope or unknown unit like
      its `project show`/`project validate` siblings, instead of answering "no url
      coordinates to check" at exit 0. At `read-all` a misspelt project name is
      reported as not registered rather than "it exists on this machine" — that
      arm is deliberately NOT enabled at narrower scopes, where it would turn
      `project show` into an existence oracle across the access boundary.
      Hidden-resource COUNTS are now correct for packs/templates/remotes even when
      the personal store is not mounted at all (the common case at
      `cco_access=read-project`): the count is computed host-side at `cco start`
      and carried into the session. It is a snapshot taken at session start — a
      pack installed on the host mid-session is not reflected, which is harmless
      because the session could not see it either way. Requires `cco build`; see
      ADR-0056 (D1-D5, D7).

  - id: 57
    date: "2026-07-29"
    type: additive
    title: "An empty path index inside a session is now a refusal, not a cheerful rc=0"
    description: >
      A session is launched FROM cco's machine-local index, so inside a session
      that index can never legitimately be empty — if it looks empty, the view is
      broken, not the machine. Until now `cco path list` and `cco list project`
      answered "the path index is empty — nothing is registered on this machine
      yet. Run cco on your host to populate it." at exit 0, which is false exactly
      where it was printed: the session came from that index. Both verbs now
      refuse (exit 1) with a message that names the real cause — the index is
      readable but holds no entries, so it has been emptied, replaced or rebuilt
      since the session started — and a remedy you can act on, which is to inspect
      or rebuild it from your host. ON THE HOST nothing changes: a machine with
      nothing registered yet legitimately has an empty index, still says so at
      exit 0, and is still told that `cco resolve` is the way to populate it. This
      completes ADR-0056 D6, which gave the same treatment to an index that is
      missing outright. Requires `cco build` for the in-session `cco`.

  - id: 58
    date: "2026-07-29"
    type: additive
    title: "cco update no longer strips comments out of a pack's pack.yml"
    description: >
      `cco update` backfills a missing llms `url` into an installed pack's
      pack.yml when it can recover one (ADR-0032 D3). It used to do that by
      re-emitting the whole `llms:` block from parsed values, which silently
      DELETED every line it had no rule for: comments indented inside the block,
      comments at column 0 — including the one heading the key that FOLLOWS the
      block — blank lines, and any sub-key it did not recognise. pack.yml is a
      file you write, so this was destroying your own annotations. It now injects
      instead of regenerating: every line is passed through untouched, and the
      only lines cco writes are the `url:` / `variant:` it adds, plus the one
      short-form list item (`- svelte`) that has to become `- name: svelte` to
      carry them. Entries that need nothing are left byte-identical, short form
      included. ⚠ If the old backfill already ran on one of your packs, the
      comments it removed are gone from disk and cco cannot restore them — it
      never had a copy. Recover them from your pack's own git history if it is
      versioned. Nothing needs re-running: the backfill is a no-op once a pack's
      urls are present.

  - id: 59
    date: "2026-07-30"
    type: additive
    title: "The 'hidden by access scope' notice now really counts what a session cannot see — and only what the command actually lists"
    description: >
      Entry 56 promised that a scoped session tells hidden from absent by
      counting what it could not enumerate — at `read-project` your `~/.cco` is
      not mounted, so a count taken by walking a directory is silently zero, and
      the count is therefore computed on the host at `cco start` and handed to
      the session. It never arrived. Every store-touching read verb runs behind
      the privilege boundary via the setuid helper, and that helper rebuilds the
      environment from scratch and copies over only the keys it whitelists — a
      list the new count was never added to. So it was dropped without a word,
      and `cco list packs` in a `read-project` session showed the one pack the
      project references with NO notice at all, exactly as if the other five did
      not exist. The key is now whitelisted, so the notice reads e.g. `note: 5
      packs hidden by access scope (cco_access=read-project) — start a
      read-global session or run cco on your host.` Nothing about what the
      boundary permits has changed: the count is a read-only number, there is no
      new privileged operation, and a session still cannot read the store
      itself. Requires `cco build` — the helper is compiled into the image. A
      static invariant (INV-DESC) now fails the suite if any future session
      signal is written without being whitelisted, since the failure mode is
      silence on both sides.
      One more thing changed with it, visible the moment the count started
      working: a notice now speaks only about the kinds the command you ran
      actually lists. Before, every read verb appended the counts for every
      resource kind in the store, so `cco list llms` — which shows you both of
      your project's llms — also announced "6 packs hidden", and `cco list
      packs` announced "2 llms hidden" about the two it was not hiding. The
      numbers disagreed with each other too (6 from one verb, 5 from another),
      because the count is "how many exist minus how many I just listed" and a
      command listing llms lists no packs at all. Each command now declares what
      it enumerates and speaks only for that: `cco list packs` counts packs,
      `cco list llms` says nothing about packs, `cco list` (everything) counts
      every kind, and `cco path list` / `cco project show` make no claim about
      the store at all.

  - id: 60
    date: "2026-07-30"
    type: additive
    title: "Renaming a pack in a session: a refusal you can act on"
    description: >
      If you ran `cco pack rename` inside a session and one of the projects
      using that pack has a repo the session does not mount, cco refused with
      "unresolved member(s) … run 'cco resolve' on your host first". Following
      that advice got you nowhere: on the host those members are already
      resolved, so `cco resolve` reported success, changed nothing, and the
      rename refused again the next time — a loop with no exit.
      The two situations look identical from inside a container and are not.
      A member can be genuinely unresolved (cco has no path for it on this
      machine — a real configuration gap you fix with `cco resolve`), or it can
      be perfectly resolved and simply not bound into THIS session, which no
      command run inside that session can change. cco now tells them apart and
      says which one you have: the second case reports that the repo is not
      mounted in this session, that it exists on this machine, and that the way
      forward is to run the rename on your host or start a session that mounts
      it. It also exits 2 (a refusal about the shape of your session) instead of
      1 (an error in your configuration), so scripts can tell the two apart too.
      Nothing about when a rename is allowed has changed — only what cco tells
      you when it is not. The same session was already rendering those members
      "[not mounted in this session]" in `cco project show`; the rename guard
      now agrees with it.

  - id: 61
    date: "2026-07-31"
    type: additive
    title: "`cco remote list` no longer sends you to widen access for a verb that was removed"
    description: >
      `cco remote list` was retired a while ago in favour of `cco list remote`,
      and running it prints a one-line redirect saying so. Inside a session,
      though, you only got that redirect if your session already had read-global
      access or wider. Below that, cco answered something else entirely —
      "'cco remote list' needs read-global scope or higher … widen it on the
      host with --cco-access read-global" — which invited you to restart your
      session at a wider access level in order to reach a command that would
      then tell you it no longer exists. The advice was not wrong about access;
      it was pointing at nothing.
      The redirect is now the same at every access level, exactly like the
      equivalent `cco pack list` / `cco template list` / `cco llms list` /
      `cco project list`: one line naming the command that replaced it. Nothing
      changed about what `cco list remote` shows, or about which access level
      you need to see remotes — only about being told the truth first.
  - id: 62
    date: "2026-08-05"
    type: additive
    title: "`ask`: a CLAUDE.md your session made stale can now be updated, with a prompt"
    description: >
      `claude_access` gains a middle value between `ro` and `rw`: **`ask`**. Where
      `ro` means "not without restarting the session" and `rw` means "silently",
      `ask` means the write is possible and never silent — the file is mounted
      writable and every modification asks you first.
      It also gains a second dimension. Beside the per-tree axes
      (`repo`/`current`/`global`/`others`) you can now set the authoring content
      kinds separately, under `entries`:
      `claude_md`, `rules`, `agents`, `skills`. The grammar is unchanged — one flat
      key=value form in every source, with a dotted key:
      `--claude-access current=ro,entries.claude_md=ask`, or the matching
      `access.claude.entries.claude_md` block in `project.yml` / `~/.cco/access.yml`.
      **Two things change for an existing project, and the second is the one you
      will notice.** By default `entries.claude_md` is `ask` and the other three are
      `ro`. So (1) your project's `CLAUDE.md` opens up — a session that finds it
      stale because of the work it just did can fix it, with one keystroke instead
      of a restart; and (2) every `CLAUDE.md` inside your repos, which until now was
      silently writable like any other file, starts prompting before it is changed.
      Nothing else moves: `rules/`, `agents/` and `skills/` stay read-only by
      default, and the deliberate way to edit them is still a config-editor session.
      Why `CLAUDE.md` and not the rest — it is the one file that goes stale as a
      *consequence* of the work the session is doing, so the session is the only
      party that knows. The others encode your intent, which does not age with the
      code.
      Two values are deliberately not offered. `ask` is not available on the global
      store or on other projects' config: neither can go stale because of this
      session, and neither gives you a git diff to review the prompt against.
      And it is not available on `cco_access` at all — that boundary is enforced by
      a setuid helper in a different trust domain, which has no channel to a dialog.
      **If your sessions run unattended, declare it.** An unanswered prompt does not
      time out — the session waits. cco cannot detect that nobody is watching, so
      autonomy is declared, never inferred: use `claude_access: none` (locked, zero
      prompts) or `repo` / `all` (open, zero prompts). Both already exist and are
      unchanged.
      **`CLAUDE.md` prompts even in a session you opened for authoring.** The gate is
      one pattern covering every `CLAUDE.md` under `/workspace` — the file set is
      unbounded (files appear while the session runs), so it cannot be enumerated per
      tree. The consequence is that `--cco-access edit-project` and config-editor
      sessions, which grant write access deliberately, still get a prompt on
      `CLAUDE.md` — and only on `CLAUDE.md`. This is known and accepted rather than
      hidden: `cco start` prints a `note:` naming the trees it affects whenever it
      happens. To author without prompts, add `entries.claude_md=rw` to
      `--claude-access` (that opens every `CLAUDE.md` under `/workspace`, your repos
      included — which is what an authoring session is for).
      No rebuild needed: the mount composition and the per-session permission rules
      are both produced at start time by the CLI, not baked into the image. Run
      `cco whoami` in a session to see the resolved state — it now reports both
      dimensions, and lists any file whose governance differs from its tree.

  - id: 63
    date: "2026-08-09"
    type: additive
    title: "`claude_access: none` now refuses `<repo>/**/CLAUDE.md`, instead of only claiming to"
    description: >
      Entry 62 said every `CLAUDE.md` under `/workspace` is governed, and that
      `claude_access: none` is locked. Both were true of the `.claude` **trees** and
      of the default `ask` value — and neither was true, together, of the one surface
      that matters most: a `CLAUDE.md` sitting in your repo outside a `.claude`
      directory. Under `none` that file was still silently writable.
      It now emits a refusal. The two halves of the same decision were split: the
      `ask` value emitted a prompt rule, the `ro` value emitted nothing at all, so the
      strictest level enforced less than the default one did.
      **What to expect.** Under `claude_access: none` an attempt to edit any
      `CLAUDE.md` under `/workspace` is refused outright — no prompt, which is what
      `none` promises. Every other level is unchanged: the default still prompts,
      `repo` and `all` still write silently. If you deliberately want a session that
      edits `CLAUDE.md` without prompts, that is `--claude-access
      …,entries.claude_md=rw`, exactly as before.
      **Read this honestly.** On the `.claude` trees cco enforces with a read-only
      mount, which a subprocess cannot get around. On `<repo>/**/CLAUDE.md` it cannot:
      that file set is unbounded — files appear while the session runs — so no mount
      can cover it and the enforcement is a permission rule. A rule stops the ordinary
      path and not a determined one; a shell redirect or an interpreter writes through
      it. It is a guard rail on that surface, not a lock, and the reference
      documentation now says so where it used to promise more.
      No rebuild needed: the rules are produced at start time by the CLI.

  - id: 64
    date: "2026-08-13"
    type: additive
    title: "Delegating to a restricted agent now delivers — cco guarantees the coordination tools"
    description: >
      **The defect.** cco enables agent teams for every session, which makes a
      teammate a separate process whose work reaches you only through
      `SendMessage`. Every agent definition that declares a `tools:` allowlist
      without it — the normal shape for a role agent — therefore did its work,
      showed it in its pane, and threw it away. Measured: 0 deliverables out of 17
      teammates, across two Claude Code versions. You saw "the agent went idle",
      never "a tool is missing", so the failure was easy to blame on cco or on the
      agent rather than on a missing line.
      **What changes.** At `cco start`, an agent definition missing any
      coordination tool (`SendMessage`, `TaskCreate`/`TaskUpdate`/`TaskList`/`TaskGet`,
      `ToolSearch`) is mounted from a normalized copy that carries it. This covers
      every agent cco mounts — your project's, a pack's, your personal store's, and
      a repo's own `.claude/agents/` — and **your files are never modified**: the
      copy exists only for the session.
      **What cco does NOT do.** It never reverses a decision you made. A definition
      is left exactly as written, and named in a warning, when the agents tree is
      mounted writable (you are authoring it), when its frontmatter does not parse
      or writes `tools:` as a block list, or when a coordination tool is named in
      `disallowedTools:`. An agent in one of those states still cannot deliver.
      **How to see it.** `cco whoami` reports which definitions were widened and —
      the part that matters — which ones have no return channel. The start-time
      warning is easy to miss until a coming release makes `cco start` pause on its
      own warnings; `cco whoami` is readable at any time.
      **The form that needs none of this**: `disallowedTools:` over an inherited
      toolset, instead of an exhaustive `tools:` allowlist.
      No rebuild needed: the projection is produced at start time by the CLI.

  - id: 65
    date: "2026-08-18"
    type: additive
    title: "cco start now pauses before it hands over the terminal, instead of losing what it printed"
    description: >
      **The defect.** `cco start` printed its messages and then handed the terminal
      to `docker compose run`. The Claude Code TUI opened over them and the
      scrollback was gone, so the entire message surface of the command was
      write-only — including the warning that says a teammate will finish its work
      and lose it. This was measured, not supposed: a real warning sat on the first
      line after the start command through a complete acceptance run, read by
      nobody.
      **What changes.** On an interactive terminal, `cco start` and `cco new` now
      always stop immediately before the container runs and wait for you. That is
      the point: a start takes about five seconds, and everything it wrote — `⚠`,
      `note:`, `ℹ`, `✓` alike — is unreadable the moment the session opens. Bare
      Enter starts; `a` aborts, and an abort leaves no container and no session
      marker behind.
      **What the pause says depends on what the run found.** A run with nothing to
      report, or with notes only, shows them and asks `Press Enter to start the
      session`. A run that emitted one or more warnings lists them and asks
      `Start the session anyway? [S/a]`. `a` aborts in every case, including the
      quiet one that does not advertise it — so a wrong project is always one
      keystroke away from being backed out of.
      **The list is built to be read at a glance.** Each message is printed
      **once** — no longer both in passing and again in the list — and the entries
      are grouped by area (packs & overlays, config hygiene, documentation/llms,
      agent teams, …) with a count per group, in a fixed order so two runs of the
      same project read the same way. Warnings come first, notes after them. Where
      a message has an obvious next command, it is shown in its own column:
      `→ cco sync`. And a condition that used to print once per item now prints
      once: five committed rules shadowed by the same pack overlay are one line
      naming all five, not five lines. A missing llms or pack is stated once too,
      in the sentence that names where cco looked and what to run — not twice, in
      two different wordings.
      **Four message levels, and only one of them asks you to decide.** `⚠` is a
      condition of this session you may want to act on; `note:` is an accepted
      divergence with nothing to do about it; `ℹ`/`✓` are the chronicle of what the
      command did; plain feedback inside a prompt is part of the prompt. There is no
      curated list of "important" warnings — the behaviour is a property of the
      level, so a warning written years from now escalates the pause on the day it
      is written.
      **Automation has two spellings, and they say different things.** With no
      controlling terminal — CI, a script, a captured run, or
      `CCO_NONINTERACTIVE=1` — there is no prompt and the launch proceeds exactly as
      before: that one means *nobody is there*. `CCO_ASSUME_YES=1`, or the new
      `--yes` / `-y` flag on `cco start` and `cco new`, means *somebody is there and
      has already answered*: the list is still shown, only the question is skipped.
      `cco start --dry-run` does not pause either — nothing takes the terminal
      there, so the output is already readable.
      No rebuild needed: it all runs host-side in the CLI.

  - id: 66
    date: "2026-08-18"
    type: additive
    title: "A writable extra mount can finally be declared from the CLI, and the onboarding prompts stop advertising choices they refuse"
    description: >
      **`cco project add mount --writable`.** An extra mount is bound read-only by
      default, and that default is unchanged. What was missing was any way to say
      the opposite from the command line: `--mount <src>:rw` has expressed a
      writable mount for a long time, but `cco project add mount` had no spelling
      for it at all, so the case was reachable only by hand-editing `project.yml`.
      `--writable` now records `readonly: false`. `--readonly` stays and keeps
      recording an explicit `readonly: true` — it no longer reads as opting into a
      restriction that was already unconditional; the pair is what shows you the
      default. The two together are an error rather than a precedence puzzle, and
      passing neither still writes no key at all.
      **The prompt that clones a missing repo now asks where to put it.** It used
      to clone to a destination you were shown but could not change, and for an
      extra mount that destination was always `~/Projects/<name>` — a place with no
      relation to where you keep your mounts. Choosing "specify a path" was no way
      out either, since it requires a directory that already exists. The prompt now
      offers its destination and accepts anything you type instead; Enter accepts
      the offer, and a relative answer is stored as an absolute path so it still
      resolves from any other directory.
      **The reuse prompt lists the choices it accepts.** When a name is already
      bound in another project, the menu offered `[1-n]` — range notation printed
      among literal keys like `[d]` and `[q]`. With a single candidate it printed
      `[1-1]`, and typing that back was rejected as invalid. It now prints the
      tokens themselves: `[1] [2] reuse that path`.
      No rebuild needed: all three run host-side in the CLI.

  - id: 67
    date: "2026-08-21"
    type: additive
    title: "cco project save/status/history — version a project's own config, see what is unsaved, and read either store's history back"
    description: >
      **`cco project save`.** Your project's config lives in `<repo>/.cco/` and is
      versioned by the repo's own git — which meant committing it by hand, picking
      it out from whatever else your working tree happened to be holding. The
      personal store has had `cco config save` for exactly this since the start;
      the in-repo side never got its twin. It has one now. `cco project save`
      stages **only** `.cco/**` and commits it: anything else that is dirty, or
      that you had already staged, is left exactly as it was, so you can save the
      config in the middle of a task. Run it from anywhere inside the repo, with
      `-m` for the message. Three things it refuses rather than fixing for you: a
      `.cco/.gitignore` that is missing or does not cover the secret patterns (it
      names the lines to add, but that file is a versioned file in your repository
      and writing it would put an unrequested change in the commit you asked for);
      an ignore rule anywhere that would keep `project.yml` or `.cco/.gitignore`
      itself out of the commit — a save that drops your config's identity, or the
      barrier every clone of it inherits, is not a save, and cco names the rule that
      actually fires, with its pattern, file and line, so you can go and change it
      (keeping `.cco/` out of git on purpose is a supported choice — it just means
      there is nothing to save); and a secret-shaped file staged under `.cco/` — the
      same two-pass scan `cco config save` runs, with `*.example` exempt, and if the
      offending path is one you had already committed it offers `git rm --cached`
      rather than telling you to move it somewhere it already is. All of them are
      reported in one go, so you never fix one and meet the next on the retry. What
      the first check asks is whether an ignore **rule exists**, so a directory-wide
      pattern counts, and a file you had already committed before adding the rule
      is not a refusal: git tracks it whatever the rule says, so the save reports it
      and proceeds — it is already in your history, and `git rm --cached` stops
      future commits from carrying it without rewriting the ones already made. In a
      multi-repo project it
      also tells you which other member repos still have an uncommitted `.cco/`,
      and separately whether the members have drifted apart in content, which is a
      `cco sync` question rather than a commit one.
      **`cco project history` and `cco config history`.** Asking how your config
      changed used to mean knowing git, knowing the pathspec, and — for `~/.cco` —
      knowing where the store even lives. Both stores now answer for themselves:
      one line per commit with the date, the author, the message, and **which
      parts of the config changed** (`project.yml`, `claude/rules`, …), `-n` to
      change how many, `--full` to add the diff. The project one is path-filtered
      rather than marked, so it shows every commit that touched `.cco/` —
      including commits that also touched code, and commits made by hand long
      before this verb existed. A store you have never saved is told so, not
      treated as an error.
      **`cco project status` and `cco config status`.** Before you save, the other
      question: what have I actually changed, and would saving it work? Both stores
      answer it, writing nothing at all — one line per file with its fate in that
      commit (`M` modified, `A` new, `D` deleted), and `--full` for the diffs. What
      it lists is **exactly what `save` would commit**, which is not what
      `git status` would show you: files git ignores are absent, everything outside
      `.cco/` is absent however dirty your tree is, and on the personal store only
      the allowlisted config appears. And it answers the other half — *would saving
      work* — for **both** ways a save can be refused: the `.gitignore` barrier, and
      the secret scan, run over the very set it just listed. It says so and still
      answers, at exit 0, in the same words the refusal would use, so you find out
      before a save is refused rather than after; when one would fire, the closing
      `→ cco project save` hint is withheld rather than pointing you at a command
      destined to fail. A file you had committed before adding the rule that covers
      it is reported below the list — not a refusal, so the hint stays; `status` is
      simply where you meet it. It never calls a config clean while any of that
      stands — having nothing to commit is not the same as being saved — and with
      `--full` it withholds the diff of a file it has just flagged as secret-like,
      printing the pattern that matched instead of the contents it warned you about
      (`*.example` skeletons excepted: they exist to be read). A clean config names
      its last save, so "nothing to do" never reads the same as "never saved".
      In a session, `project save` needs an edit-project (or wider) level and
      `project status` / `project history` are free at any level; the `config`
      readers need read-global, because at read-project the personal store is not
      mounted for them to read.
      No rebuild needed for the commands themselves — they run host-side in the
      CLI. The baked agent rule that pointed at this verb before it existed is
      updated in the image, so `cco build` refreshes what in-session agents are
      told.
